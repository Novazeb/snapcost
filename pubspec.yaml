name: snapcost
description: "SnapCost - Clean & Effortless Expense Scanner App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Architecture & State Management
  provider: ^6.1.2

  # Camera & AI OCR
  camera: ^0.10.5+9
  google_mlkit_text_recognition: ^0.11.0
  image_picker: ^1.0.7

  # Biometrics & Security
  local_auth: ^2.1.8

  # Database & Offline Storage
  sqflite: ^2.3.2
  path: ^1.9.0
  shared_preferences: ^2.2.2

  # Data Visualization & UI
  fl_chart: ^0.66.2
  intl: ^0.19.0
  google_fonts: ^6.1.0

  # Notifications & System
  flutter_local_notifications: ^17.0.0
  csv: ^6.0.0
  share_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets can be added here if needed
  # assets:
  #   - assets/images/
